<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf7f2;--ink:#2b1a2a;--plum:#4a2545;--gold:#b8861f;--card:#fff;--line:#e6dccf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1220;--ink:#f3ebe0;--plum:#d9a9d3;--gold:#e0b04a;--card:#2a1c2f;--line:#44304a}}
:root[data-theme="dark"]{--bg:#1c1220;--ink:#f3ebe0;--plum:#d9a9d3;--gold:#e0b04a;--card:#2a1c2f;--line:#44304a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
button,input,textarea{font:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{margin:0;font-size:1.6rem;color:var(--plum);letter-spacing:.5px}
.bar{display:flex;gap:8px}
@media(max-width:420px){h1{font-size:1.2rem}.btn{padding:8px 12px}}
.btn{border:1px solid var(--plum);background:transparent;color:var(--plum);padding:8px 14px;border-radius:999px;cursor:pointer}
.btn.fill{background:var(--plum);color:var(--bg)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{padding:36px 16px 20px;max-width:1100px;margin:auto}
.hero h2{font-size:clamp(1.8rem,6vw,3rem);line-height:1.1;margin:0 0 10px;color:var(--plum)}
.hero p{margin:0;max-width:52ch}
.tags{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:1100px;margin:auto}
.tags button{white-space:nowrap}
.tags .on{background:var(--plum);color:var(--bg)}
.grid{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:8px 16px 40px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:110px;display:grid;place-items:center;font-size:2.4rem;color:#fff}
.pic.photo{height:auto;aspect-ratio:1/1;background:#fff}.pic.photo.land{aspect-ratio:4/3}.pic.photo.wide{aspect-ratio:13/5}.pic.photo.long{aspect-ratio:4/7}.pic.photo.tall{aspect-ratio:3/4}.pic img{width:100%;height:100%;object-fit:cover;display:block}
.logo{width:48px;height:48px;border-radius:10px;object-fit:cover;display:block}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 16px;font-size:.9rem}.note:empty{display:none}#cart .note{margin:8px 0}
.deliv{margin:10px 0 0;font-weight:bold;color:var(--gold);max-width:52ch}.deliv:empty{display:none}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:#0b6e3a;color:#fff;text-decoration:none;padding:12px 18px;border-radius:999px;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.wa:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info b{font-size:1rem}
.price{color:var(--gold);font-weight:bold}
.info .btn{margin-top:auto}
#cart{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .25s;z-index:10;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#cart.open{transform:none}
@media(prefers-reduced-motion:reduce){#cart{transition:none}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--plum);background:none;color:var(--plum);cursor:pointer}
label{display:block;margin:10px 0 4px;font-size:.9rem}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.total{font-size:1.2rem;font-weight:bold;margin:12px 0}
.msg{color:#b3261e;min-height:1.2em;font-size:.9rem}
footer{white-space:pre-line;text-align:center;padding:24px 16px 90px;border-top:1px solid var(--line);font-size:.9rem}
</style>
</head>
